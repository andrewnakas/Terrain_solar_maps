name: Deploy 3D Solar Terrain to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build
        run: |
          echo "Building 3D Solar Terrain Map site..."
          mkdir -p _site
          cp index.html _site/
          cp solar-terrain.js _site/

          # Create a simple 404 page
          cat > _site/404.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Page Not Found</title>
            <meta http-equiv="refresh" content="0; url=/">
          </head>
          <body>
            <p>Redirecting to map...</p>
          </body>
          </html>
          EOF

          echo "Build complete!"
          ls -la _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  # Deploy from main/master with environment protection
  deploy-production:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Deploy from claude branches without environment protection (for immediate testing)
  deploy-preview:
    if: startsWith(github.ref, 'refs/heads/claude/')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Output URL
        run: |
          echo "🚀 Deployment complete!"
          echo "📍 URL: ${{ steps.deployment.outputs.page_url }}"
